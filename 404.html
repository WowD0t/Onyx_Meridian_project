:root{--bg:#0b0d12;--tx:#d9dde8;--mu:#8b93a7;--ac:#9b73f5;--ac2:#b794ff}

body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
