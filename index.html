<!DOCTYPE html>

<html data-root="" data-theme="dark" lang="en"><head><meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Onyx Meridian Interactive Studio</title>
<meta content="2;url=en-index.html" http-equiv="refresh"/>
<link href="assets-img-emblem-64.png" rel="icon" type="image/png"/>
<style>
:root{--bg:#0b0d12;--tx:#d9dde8;--ac:#9b73f5}
html[data-theme="light"]{--bg:#f5f2ec;--tx:#201c15;--ac:#54349e}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .4s,color .4s}
.wrap{text-align:center;animation:in .7s cubic-bezier(.16,1,.3,1) both}
img{width:96px;height:96px;animation:float 7s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:15px;letter-spacing:.22em;font-weight:700;margin:18px 0 6px}
a{color:var(--ac);margin:0 10px;font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
</style>
<script>try{var t=localStorage.getItem('om-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script>
(function(){var l=null;try{l=localStorage.getItem('om-lang');}catch(e){}
if(!l){l=(navigator.language||'en').toLowerCase().indexOf('ru')===0?'ru':'en';}
window.location.replace(l+'-index.html');})();
</script></head>
<body><div class="wrap"><img alt="Onyx Meridian emblem" src="assets-img-emblem-256.png"/>
<h1>ONYX MERIDIAN</h1><div><a href="ru-index.html">Русский</a>·<a href="en-index.html">English</a></div></div></body></html>
