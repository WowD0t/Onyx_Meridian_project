name: Sync GitHub Wiki
on:
  push:
    branches: [main]
    paths: ['*.md']
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then echo "Set the WIKI_TOKEN secret (classic PAT, repo scope)"; exit 1; fi
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-out
          for f in *.md; do case "$f" in README.md|WIKI-UPLOAD.md) continue;; esac; cp "$f" wiki-out/; done
          cd wiki-out
          for f in *.md; do sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md\)/](\1)/g' "$f"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync wiki from repository"
          git push
